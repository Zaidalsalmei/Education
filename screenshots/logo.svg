<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="320" height="100">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#A78BFA;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#67E8F9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FCD34D;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="320" height="100" rx="16" fill="#0D0B1E"/>
  <!-- Logo box -->
  <rect x="16" y="22" width="56" height="56" rx="12" fill="url(#logoGrad)" filter="url(#glow)"/>
  <!-- E letter -->
  <text x="44" y="60" font-family="Arial, sans-serif" font-size="32" font-weight="800" fill="white" text-anchor="middle" dominant-baseline="middle">E</text>
  <!-- EduHub text -->
  <text x="90" y="48" font-family="Arial, sans-serif" font-size="32" font-weight="800" fill="url(#textGrad)" dominant-baseline="middle">EduHub</text>
  <!-- Tagline -->
  <text x="90" y="74" font-family="Arial, sans-serif" font-size="13" fill="#A78BFA" opacity="0.8">Smart Educational Resources</text>
</svg>
